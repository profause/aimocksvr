services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mocksvr:latest
    container_name: mocksvr-app

    environment:
      MOCKSVR_DASHBOARD_ENABLED: ${MOCKSVR_DASHBOARD_ENABLED:-true}

      MOCKSVR_SERVER_HOST: 0.0.0.0
      MOCKSVR_SERVER_PORT: "8080"

      MOCKSVR_DATABASE_URL: ${MOCKSVR_DATABASE_URL:-postgres://mocksvr:mocksvr@postgres:5432/mocksvr?sslmode=disable}

      MOCKSVR_CACHE_REDIS_ADDR: ${MOCKSVR_CACHE_REDIS_ADDR:-redis:6379}
      MOCKSVR_CACHE_REDIS_PASSWORD: ${MOCKSVR_CACHE_REDIS_PASSWORD:-}
      MOCKSVR_CACHE_REDIS_DB: ${MOCKSVR_CACHE_REDIS_DB:-0}
      MOCKSVR_CACHE_REDIS_TTL: ${MOCKSVR_CACHE_REDIS_TTL:-60s}

      MOCKSVR_AI_PROVIDER: ${MOCKSVR_AI_PROVIDER:-}
      MOCKSVR_AI_BASE_URL: ${MOCKSVR_AI_BASE_URL:-}
      MOCKSVR_AI_API_KEY: ${MOCKSVR_AI_API_KEY:-}
      MOCKSVR_AI_MODEL: ${MOCKSVR_AI_MODEL:-}
      MOCKSVR_AI_TIMEOUT: ${MOCKSVR_AI_TIMEOUT:-}

      MOCKSVR_AUTH_ENABLED: ${MOCKSVR_AUTH_ENABLED:-false}
      MOCKSVR_LOG_LEVEL: ${MOCKSVR_LOG_LEVEL:-info}
      MOCKSVR_AUTH_API_KEYS: ${MOCKSVR_AUTH_API_KEYS:-}
      MOCKSVR_AUTH_WORKSPACE_TOKENS: ${MOCKSVR_AUTH_WORKSPACE_TOKENS:-}
      MOCKSVR_AUTH_JWT_SECRET: ${MOCKSVR_AUTH_JWT_SECRET:-}
      MOCKSVR_AUTH_JWT_ISSUER: ${MOCKSVR_AUTH_JWT_ISSUER:-}
      MOCKSVR_AUTH_JWT_AUDIENCE: ${MOCKSVR_AUTH_JWT_AUDIENCE:-}
      MOCKSVR_AUTH_JWT_TTL: ${MOCKSVR_AUTH_JWT_TTL:-}
    ports:
      - "8080"
      - "8999:8080"

    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    extra_hosts:
      - "host.docker.internal:host-gateway"