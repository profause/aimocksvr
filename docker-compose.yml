services:
  postgres:
    image: postgres:16-alpine
    container_name: mocksvr-postgres
    environment:
      POSTGRES_USER: mocksvr
      POSTGRES_PASSWORD: mocksvr
      POSTGRES_DB: mocksvr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocksvr -d mocksvr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mocksvr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
