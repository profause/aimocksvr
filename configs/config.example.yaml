app:
  name: mocksvr
  env: development

server:
  host: 0.0.0.0
  port: 80

database:
  url: postgres://mocksvr:mocksvr@localhost:5432/mocksvr?sslmode=disable

cache:
  redis:
    addr: localhost:6379
    password: ""
    db: 0
    ttl: 60s

# AI providers are OpenAI-compatible. OpenAI and OpenRouter require an API key;
# Ollama runs locally and does not.
ai:
  provider: ollama          # openai | ollama | openrouter (empty disables AI)
  base_url: http://localhost:11434/v1
  api_key: ""
  model: llama3.2
  timeout: 60s

# Auth is disabled by default. When enabled, the control plane requires a
# valid credential and mock endpoints can be marked private.
auth:
  enabled: false
  api_keys: ""              # comma-separated "name:secret" pairs
  workspace_tokens: ""      # comma-separated "workspace:secret" pairs
  jwt_secret: ""            # HS256 secret for JWT validation/minting
  jwt_issuer: mocksvr
  jwt_audience: mocksvr
  jwt_ttl: 1h

dashboard:
  enabled: false

log:
  level: info
